[project]
name = "music-bot"
version = "1.2.0"
description = "Twitch/Discord Spotify song-request bot"
readme = "README.md"
authors = [
    { name = "Sam Hudson", email = "samhudson@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "discord.py>=2.7.1",
    "fastapi>=0.115.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "spotipy>=2.26.0",
    "table2ascii>=1.2.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
venvPath = "."
venv = ".venv"
# code uses flat imports (e.g. `from utils import ...`) that
# rely on src/ and tests/ being source roots.
extraPaths = ["src", "tests"]
pythonVersion = "3.14"
